<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        #noteInput {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }
        #saveBtn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        #saveBtn:hover {
            background-color: #218838;
        }
        .note {
            background-color: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 5px solid #28a745;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .note-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>📒 Personal Notes Application</h2>
    <textarea id="noteInput" placeholder="Write your note here..."></textarea>
    <button id="saveBtn">💾 Save Note</button>

    <div id="notesList"></div>

    <script>
        const noteInput = document.getElementById('noteInput');
        const saveBtn = document.getElementById('saveBtn');
        const notesList = document.getElementById('notesList');

        function getNotes() {
            return JSON.parse(localStorage.getItem('myNotes')) || [];
        }

        function saveNote(text) {
            const notes = getNotes();
            notes.unshift({ text: text, date: new Date().toLocaleString() });
            localStorage.setItem('myNotes', JSON.stringify(notes));
        }

        function deleteNote(index) {
            const notes = getNotes();
            notes.splice(index, 1);
            localStorage.setItem('myNotes', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            notesList.innerHTML = '';
            getNotes().forEach((note, index) => {
                const noteEl = document.createElement('div');
                noteEl.className = 'note';
                noteEl.innerHTML = `
                    <div class="note-text">${note.text}<br><small style="color:#888; font-size:12px;">${note.date}</small></div>
                    <button class="delete-btn" onclick="deleteNote(${index})">🗑️ Delete</button>
                `;
                notesList.appendChild(noteEl);
            });
        }

        saveBtn.addEventListener('click', () => {
            const text = noteInput.value.trim();
            if (text) {
                saveNote(text);
                noteInput.value = '';
                renderNotes();
            }
        });

        renderNotes();
    </script>

</body>
</html>
